# TradingView MCP Hub — default run settings
# Override with: python -m hub run --config path/to/other.yaml

symbol: BINANCE:DOGEUSDT
# Perp/futures chart instead: BINANCE:DOGEUSDT.P
# Locked: 1h. Do not switch to 1D until a daily strategy family is chosen (decisions.md).
timeframe: "60"
# Saved TradingView layout name (exact or substring). Empty = stay on the open chart.
# Example: layout: HUB-DOGE-BT
layout: "crypto"

# How many inject → compile → backtest → edit cycles to allow.
loop_limit: 20

# Initial capital assumed by the Pine strategy (USD).
initial_capital: 10000

target:
  # Stop the loop when ALL of these pass.
  net_profit_percent: 20.0
  min_trades: 20
  min_profit_factor: 1.2
  max_drawdown_percent: 35.0

pine:
  source_path: pinescript/doge_daily_ma_reclaim.pine
  current_path: pinescript/current.pine

tv:
  command: ["node", "vendor/tradingview-mcp/src/cli/index.js"]
  cdp_port: 9222
  compile_wait_seconds: 6
  results_wait_seconds: 10
  results_retries: 6
  screenshot: false
  # Remove other Strategy studies on the chart so Tester does not read them.
  # Hide-only is not enough. Tester can unhide hidden strategies.
  clear_existing_strategies: true
  keep_strategy_substring: "HUB DOGE"

mutation:
  # params: Python hill-climb of HUB-tagged inputs (no LLM needed)
  # agent:  one backtest per call; Cursor skill edits Pine logic
  mode: params
  seed: 7
  knobs:
    ma_len: [50, 89]
    atr_mult: [2.0]
    rr_ratio: [2.0]
    # 1.005 was tried and rejected (MDD 37.8%). Do not put it back; see ledger.md.
    reclaim_pct: [1.015]

output:
  runs_dir: runs
