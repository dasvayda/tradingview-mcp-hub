# Out-of-sample smoke: same Keep pine on HYPE perpetual.
# Layout crypto then symbol override. Do not compare NP to DOGE keep.

symbol: BINANCE:HYPEUSDT.P
timeframe: "60"
layout: crypto
loop_limit: 1
initial_capital: 10000

target:
  net_profit_percent: 20.0
  min_trades: 20
  min_profit_factor: 1.2
  max_drawdown_percent: 35.0

pine:
  source_path: pinescript/doge_daily_ma_reclaim.pine
  current_path: pinescript/current.pine

tv:
  command: ["node", "vendor/tradingview-mcp/src/cli/index.js"]
  cdp_port: 9222
  compile_wait_seconds: 8
  results_wait_seconds: 12
  results_retries: 6
  screenshot: false
  clear_existing_strategies: true
  keep_strategy_substring: "HUB DOGE"

mutation:
  mode: params
  seed: 7
  knobs:
    ma_len: [89]
    atr_mult: [2.0]
    rr_ratio: [2.0]
    reclaim_pct: [1.015]

output:
  runs_dir: runs/live-smoke-hype
